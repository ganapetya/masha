# Saveli plug for apriltag_ros (AprilTagNode).
# Printed on Saveli: BLACK square 60 mm (white margin extra, not in this number).
# After printing, measure with a ruler and correct these two numbers.
image_transport: 'raw'
family: '36h11'
size: 0.06
threads: 2
max_hamming: 0
z_up: false
decimate: 1.0
blur: 0.0
refine-edges: 1
debug: 0
tag_ids: [0]
tag_frames: [saveli_tag]
tag_sizes: [0.06]
