# Saveli plug for apriltag_ros (AprilTagNode), started by masha_hunter.launch.py.
# The hunter node does NOT subscribe to detections — it looks up TF child
# saveli_tag in base_link. If tag_frames is ignored, that child is named
# tag36h11:0 instead; saveli_tf_frame() in the node accepts both.
#
# Print: black 36h11 square on a WHITE card. The white margin around the
# black square is the quiet zone (required). size: is the BLACK square
# only, 60 mm; do not include the white margin in that number.
# ComposableNode needs the /** / ros__parameters wrapper or tag_frames
# is ignored and TF is published as tag36h11:0 instead of saveli_tag.
/**:
  ros__parameters:
    image_transport: 'raw'
    family: '36h11'
    size: 0.06
    threads: 2
    max_hamming: 1
    z_up: false
    decimate: 1.0
    blur: 0.0
    refine-edges: 1
    debug: 0
    tag_ids: [0]
    tag_frames: ['saveli_tag']
    tag_sizes: [0.06]
