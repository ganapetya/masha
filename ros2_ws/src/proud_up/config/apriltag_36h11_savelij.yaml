# Saveli plug for apriltag_ros (AprilTagNode).
# Clipboard-era default size is 0.08 m — do not trust that.
# Measure the black-square edge of the printed tag36h11 and put metres here.
image_transport: 'raw'
family: '36h11'
size: 0.08
threads: 2
max_hamming: 0
z_up: false
decimate: 1.0
blur: 0.0
refine-edges: 1
debug: 0
tag_ids: [0]
tag_frames: [saveli_tag]
tag_sizes: [0.08]
