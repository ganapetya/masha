masha_interaction_node:
  ros__parameters:
    asr_topic: /asr_node/voice_words
    traveling_topic: /controller/traveling
    cmd_vel_topic: /controller/cmd_vel
    run_actionset_topic: /controller/run_actionset
    # ActionGroupController publishes on the controller node's relative
    # "action_complete" → /controller/action_complete. /action_complete
    # (absolute) is a different topic and stays quiet for .d6a playback.
    action_complete_topic: /controller/action_complete

    action_name: master_dance
    master_response_mp3: /home/ubuntu/ros2_ws/src/xf_mic_asr_offline/feedback_voice/english/master_response.mp3
    music_mp3: /home/ubuntu/ros2_ws/src/proud_up/sounds/master_dance.mp3
    music_loop: true

    halt_wait_s: 0.4
    speak_timeout_s: 8.0
    # master_dance.d6a is 13.5 s; margin covers a slow first row.
    dance_timeout_s: 16.5
