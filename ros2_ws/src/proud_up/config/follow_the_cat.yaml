follow_the_cat_node:
  ros__parameters:
    image_topic: /depth_cam/rgb/image_raw
    camera_info_topic: /depth_cam/rgb/camera_info
    servo_topic: servo_controller
    cmd_vel_topic: /controller/cmd_vel
    controller_ready_service: /controller_manager/init_finish
    init_pose_ready_service: /init_pose/init_finish
    wait_for_ready: true
    image_qos_reliable: false
    # First live bring-up is gaze-only. Turn on after pan/tilt signs are verified.
    enable_walk: false
    dry_run: false

    # Gaze target. "human" = YOLOv8n person (any viewpoint), LBP face if
    # you look at the lens. "phone" = black portrait rectangle.
    target: human
    cascade_dir: /usr/share/opencv4/haarcascades
    lbp_dir: /usr/share/opencv4/lbpcascades
    person_onnx: ""   # empty → share/proud_up/models/yolov8n.onnx
    person_conf: 0.45
    person_iou: 0.45
    person_imgsz: 320
    dnn_cuda: true
    enable_face_refine: false
    person_head_frac: 0.45
    max_box_frac: 0.40
    person_max_aspect: 1.05
    track_gate_frac: 0.22
    human_image_scale: 0.45
    human_scale_factor: 1.2
    human_min_neighbors: 3
    min_face: 24
    min_upper: 50
    min_full: 60
    enable_upper_body: false
    enable_full_body: false
    debug_max_width: 640

    # Black portrait rectangle = switched-off phone (only if target:=phone).
    threshold: 90
    loose_threshold: 130
    min_area: 800.0
    max_area: 80000.0
    max_area_frac: 0.22
    min_aspect: 0.28
    max_aspect: 0.85
    min_solidity: 0.55
    blur_ksize: 5
    morph_ksize: 5
    border_margin: 4
    reject_border: true
    require_quad: true
    require_portrait: true

    # Pan sign from live hardware + vendor color_track: target to the right of
    # the image → decrease pulse 19. If she pans the wrong way, flip to +1.
    yaw_sign: -1.0
    pitch_sign: 1.0
    pan_min: 200.0
    pan_max: 800.0
    tilt_min: 80.0
    tilt_max: 250.0

    # Camera-forward rest (proud_up / init_horizontal). Tilt this week is id 22,
    # not 23 (23 is wrist yaw). Never command leg ids 1–18.
    arm_duration: 1.0
    arm_id19: 500.0
    arm_id20: 810.0
    arm_id21: 180.0
    arm_id22: 150.0
    arm_id23: 500.0
    arm_id24: 500.0

    lock_seconds: 2.0
    lost_timeout_seconds: 6.0
    walk_seconds: 3.0
    walk_speed: 0.05
    center_yaw_tol: 0.08
    center_pitch_tol: 0.20
    servo_duration: 0.08
    ready_timeout_seconds: 30.0
    # Incremental gaze onto the *image centre* (magenta cross in Foxglove).
    # Soft steps + a 3.4 deg deadband: once you are in the picture, hold.
    gaze_gain: 0.18
    gaze_ki: 0.0
    max_step_pulses: 8.0
    deadband_rad: 0.06
    aim_u_offset_px: 0.0
    aim_v_offset_px: 0.0
    ema_alpha: 0.30
    confirm_frames: 3
    max_jump_px: 180.0
