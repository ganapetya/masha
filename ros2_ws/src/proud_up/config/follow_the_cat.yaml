follow_the_cat_node:
  ros__parameters:
    image_topic: /depth_cam/rgb/image_raw
    camera_info_topic: /depth_cam/rgb/camera_info
    servo_topic: servo_controller
    cmd_vel_topic: /controller/cmd_vel
    controller_ready_service: /controller_manager/init_finish
    init_pose_ready_service: /init_pose/init_finish
    wait_for_ready: true
    image_qos_reliable: false
    # First live bring-up is gaze-only. Turn walk on after pan/tilt signs
    # are verified on the robot (person to the right should decrease pulse 19).
    enable_walk: false
    dry_run: false

    # YOLOv8n finds a person from any viewpoint. LBP face is optional and
    # off: it only helps when someone looks at the lens, and it can lock
    # onto a window instead.
    cascade_dir: /usr/share/opencv4/haarcascades
    lbp_dir: /usr/share/opencv4/lbpcascades
    person_onnx: ""   # empty → share/proud_up/models/yolov8n.onnx
    person_conf: 0.45
    person_iou: 0.45
    person_imgsz: 320
    dnn_cuda: true
    enable_face_refine: false
    person_head_frac: 0.45   # aim at the torso, not the top of the YOLO box
    max_box_frac: 0.40
    person_max_aspect: 1.05
    track_gate_frac: 0.22
    human_image_scale: 0.45
    human_scale_factor: 1.2
    human_min_neighbors: 3
    min_face: 24
    debug_max_width: 640

    # Pan sign from live hardware + vendor color_track: person to the right
    # of the image → decrease pulse 19. If she pans the wrong way, flip to +1.
    yaw_sign: -1.0
    pitch_sign: 1.0
    pan_min: 200.0
    pan_max: 800.0
    tilt_min: 80.0
    tilt_max: 250.0

    # Camera-forward rest (proud_up / init_horizontal). Tilt is id 22,
    # not 23 (23 is wrist yaw). Never command leg ids 1–18.
    arm_duration: 1.0
    arm_id19: 500.0
    arm_id20: 810.0
    arm_id21: 180.0
    arm_id22: 150.0
    arm_id23: 500.0
    arm_id24: 500.0

    lock_seconds: 2.0
    lost_timeout_seconds: 6.0
    walk_seconds: 3.0
    walk_speed: 0.05
    # If cmd_vel goes quiet while walking (detect/control stall), halt via
    # Traveling gait 0 then -2. Never publish a zero Twist (in-place gait).
    walk_watchdog_seconds: 0.3
    center_yaw_tol: 0.08    # ≈ 4.6 deg
    center_pitch_tol: 0.20  # ≈ 11.5 deg
    servo_duration: 0.08
    ready_timeout_seconds: 30.0
    # Incremental gaze onto the image centre (magenta cross in Foxglove).
    # Small steps + a 3.4 deg deadband: once the person is in the picture, hold.
    gaze_gain: 0.10
    gaze_ki: 0.0
    max_step_pulses: 8.0
    deadband_rad: 0.06
    aim_u_offset_px: 0.0
    aim_v_offset_px: 0.0
    ema_alpha: 0.30
    confirm_frames: 3
    max_jump_px: 180.0
